<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Dark Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,#0f172a,#020617);font-family:Arial,sans-serif}
.calculator{width:340px;padding:24px;background:#1e293b;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.05)}
h2{text-align:center;color:#94a3b8;margin-top:0;font-weight:500;font-size:20px;letter-spacing:0.5px}
#display{width:100%;height:80px;margin-bottom:20px;padding:16px;border:none;border-radius:14px;background:#0f172a;text-align:right;font-size:32px;color:#f8fafc;box-shadow:inset 0 2px 8px rgba(0,0,0,0.5)}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:58px;border:none;border-radius:14px;background:#334155;color:#f8fafc;font-size:22px;cursor:pointer;transition:all 0.1s ease}
button:hover{background:#475569;transform:translateY(-1px)}
button:active{transform:translateY(1px)}
.operator{background:#2563eb;color:white}
.operator:hover{background:#3b82f6}
.clear{background:#dc2626;color:white}
.clear:hover{background:#ef4444}
.equals{background:#0ea5e9;color:white}
.equals:hover{background:#38bdf8}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calculator">
<h2>Calculator</h2>
<input id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearAll()">C</button>
<button onclick="backspace()">⌫</button>
<button class="operator" onclick="percent()">%</button>
<button class="operator" onclick="chooseOperator('/')">÷</button>
<button onclick="appendNumber('7')">7</button>
<button onclick="appendNumber('8')">8</button>
<button onclick="appendNumber('9')">9</button>
<button class="operator" onclick="chooseOperator('*')">×</button>
<button onclick="appendNumber('4')">4</button>
<button onclick="appendNumber('5')">5</button>
<button onclick="appendNumber('6')">6</button>
<button class="operator" onclick="chooseOperator('-')">−</button>
<button onclick="appendNumber('1')">1</button>
<button onclick="appendNumber('2')">2</button>
<button onclick="appendNumber('3')">3</button>
<button class="operator" onclick="chooseOperator('+')">+</button>
<button onclick="toggleSign()">+/−</button>
<button class="zero" onclick="appendNumber('0')">0</button>
<button onclick="appendNumber('.')">.</button>
<button class="equals" onclick="calculate()">=</button>
</div>
</div>

<script>
const display = document.getElementById("display");
let current = "0";
let first = null;
let op = null;
let startNew = true;

function show(text) {
    display.value = text;
}

function format(n) {
    if (!Number.isFinite(n)) return "Error";
    let str = String(Number(n.toPrecision(12)));
    if(str.includes('.') && str.endsWith('0')) {
        str = str.replace(/\.?0+$/, '');
    }
    return str;
}

function apply(a, b, operator) {
    switch (operator) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? NaN : a / b;
        default: return b;
    }
}

function appendNumber(n) {
    if (current === "Error") clearAll();
    if (startNew) {
        current = n === "." ? "0." : n;
        startNew = false;
    } else {
        if (n === "." && current.includes(".")) return;
        if (current === "0" && n !== ".") current = n;
        else current += n;
    }
    show(current);
}

function chooseOperator(nextOp) {
    if (current === "Error") return;
    const val = Number(current);
    if (first === null) {
        first = val;
    } else if (!startNew && op) {
        const res = apply(first, val, op);
        first = res;
        current = format(res);
        show(current);
    }
    op = nextOp;
    startNew = true;
}

function calculate() {
    if (current === "Error" || first === null || !op) return;
    const res = apply(first, Number(current), op);
    current = format(res);
    first = null;
    op = null;
    startNew = true;
    show(current);
}

function clearAll() {
    current = "0";
    first = null;
    op = null;
    startNew = true;
    show("0");
}

function backspace() {
    if (startNew || current === "Error" || current === "0") return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    show(current);
}

function toggleSign() {
    if (current === "Error" || current === "0") return;
    current = format(-Number(current));
    show(current);
}

function percent() {
    if (current === "Error") return;
    current = format(Number(current) / 100);
    show(current);
}

document.addEventListener("keydown", function(e) {
    if (/^[0-9.]$/.test(e.key)) appendNumber(e.key);
    else if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
    else if (e.key === "%") percent();
    else if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        calculate();
    }
    else if (e.key === "Escape" || e.key === "Delete") clearAll();
    else if (e.key === "Backspace") backspace();
});
</script>
</body>
</html>
